<html lang="en">
<head>

<meta name="theme-color" content="#0e1219" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.webmanifest">

<meta property="og:title" content="Bhagavad Gita Reader">
<meta property="og:description" content="All 701 verses of the Bhagavad Gita in Sanskrit with transliteration and fresh English and Hindi translations, linked to every person and idea. Free, no ads, works offline.">

<title>Bhagavad Gita Reader · Sanskrit, English and Hindi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Sanskrit&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: reading-first. Phone = one column + bottom tabs; tablet = icon rail + reader; desktop = rail + chapter list + reader + context column. */
:root{
  --bg:#f4f5f1; --surface:#ffffff; --sunk:#eceee8; --ink:#16202c; --muted:#5d6672; --line:#dcdfd8;
  --accent:#0b6b70; --accent-ink:#ffffff; --mark:#b8720c;
  --sp-krishna:#2c58c4; --sp-arjuna:#b9501d; --sp-sanjaya:#4d7a1c; --sp-dhrit:#7a4b98; --sp-duryo:#a8283c;
  --t-person:#9a5a14; --t-concept:#0b6b70; --t-path:#a32f50; --t-guna:#667412; --t-section:#58606f; --t-chapter:#16202c;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Mukta", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-skt:"Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
  --f-hi:"Tiro Devanagari Hindi", "Noto Serif Devanagari", serif;
  --scale:1; --r:10px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1219; --surface:#161c26; --sunk:#1c2330; --ink:#e7e9ee; --muted:#9aa3b1; --line:#2a3240;
  --accent:#4cc0c2; --accent-ink:#06171a; --mark:#f0b44a;
  --sp-krishna:#7ea3ff; --sp-arjuna:#f19461; --sp-sanjaya:#a2cc63; --sp-dhrit:#c899e0; --sp-duryo:#f27a8d;
  --t-person:#e6a35a; --t-concept:#4cc0c2; --t-path:#f0809b; --t-guna:#c2d264; --t-section:#a7b0c2; --t-chapter:#e7e9ee;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1219; --surface:#161c26; --sunk:#1c2330; --ink:#e7e9ee; --muted:#9aa3b1; --line:#2a3240;
  --accent:#4cc0c2; --accent-ink:#06171a; --mark:#f0b44a;
  --sp-krishna:#7ea3ff; --sp-arjuna:#f19461; --sp-sanjaya:#a2cc63; --sp-dhrit:#c899e0; --sp-duryo:#f27a8d;
  --t-person:#e6a35a; --t-concept:#4cc0c2; --t-path:#f0809b; --t-guna:#c2d264; --t-section:#a7b0c2; --t-chapter:#e7e9ee;
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.skt{font-family:var(--f-skt)}
.hi{font-family:var(--f-hi)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.rail,.side{display:none}
.main{min-width:0;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;
  padding-block:8px;padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));
  background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{flex:1;min-width:0;margin:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border-radius:12px;border:0;background:transparent;cursor:pointer;color:var(--ink)}
.ibtn:hover{background:var(--sunk)}
.ibtn svg{width:22px;height:22px}
.langpill{font-size:14px;font-weight:600;border:1px solid var(--line);height:36px;border-radius:999px;min-width:0;padding:0 12px}
.content{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:8px 24px;max-width:760px;margin:0 auto}
.ctx{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 24px;max-width:760px;margin:0 auto}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tab-h);font-size:12px;color:var(--muted);font-weight:500}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current=page]{color:var(--accent)}
.tabs a[aria-current=page] .ico{background:color-mix(in srgb, var(--accent) 16%, transparent)}
.ico{display:grid;place-items:center;width:56px;height:30px;border-radius:999px}

@media (min-width:700px){
  .app{grid-template-columns:76px minmax(0,1fr)}
  .tabs{display:none}
  .main{padding-bottom:40px}
  .rail{display:flex;flex-direction:column;align-items:center;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);
    height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:14px 0 14px env(safe-area-inset-left,0px);
    border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{font-family:var(--f-skt);font-size:26px;color:var(--accent);margin-bottom:10px;line-height:1}
  .rail a,.rail button{display:flex;flex-direction:column;align-items:center;gap:2px;width:68px;padding:6px 0;border-radius:12px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:500;text-align:center;line-height:1.2}
  .rail a:hover,.rail button:hover{color:var(--ink)}
  .rail a svg,.rail button svg{width:22px;height:22px}
  .rail a[aria-current=page]{color:var(--accent)}
  .rail a[aria-current=page] .ico{background:color-mix(in srgb, var(--accent) 16%, transparent)}
  .rail .spacer{flex:1}
}
@media (min-width:1100px){
  .app{grid-template-columns:76px 284px minmax(0,1fr)}
  .side{display:block;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    overflow-y:auto;border-right:1px solid var(--line);padding:16px 10px 24px}
  .side h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 10px 8px;font-weight:600}
  .side ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
  .side a{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 10px;border-radius:8px;font-size:14.5px;line-height:1.3}
  .side a:hover{background:var(--sunk)}
  .side a[aria-current=true]{background:color-mix(in srgb, var(--accent) 13%, transparent);color:var(--ink)}
  .side .n{font-family:var(--f-skt);color:var(--muted);font-size:15px}
  .side .c{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
}
@media (min-width:1320px){
  .page{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:8px;align-items:start;max-width:1180px;margin:0 auto}
  .content{margin:0;max-width:none;padding-right:24px}
  .ctx{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);max-height:calc(100dvh - 90px);overflow-y:auto;margin:0;padding:8px 16px 24px;max-width:none}
}

/* ---------- shared pieces ---------- */
.eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
:root[lang=hi] .eyebrow{letter-spacing:0;text-transform:none;font-size:14px}
h2.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:28px 0 10px}
:root[lang=hi] h2.sec{letter-spacing:0;text-transform:none;font-size:15px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.d-krishna{background:var(--sp-krishna)} .d-arjuna{background:var(--sp-arjuna)} .d-sanjaya{background:var(--sp-sanjaya)} .d-dhrit{background:var(--sp-dhrit)} .d-duryo{background:var(--sp-duryo)}
.d-person{background:var(--t-person)} .d-concept{background:var(--t-concept)} .d-path{background:var(--t-path)} .d-guna{background:var(--t-guna)} .d-section{background:var(--t-section)} .d-chapter{background:var(--t-chapter)}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;cursor:pointer;line-height:1.2}
.chip:hover{border-color:var(--muted)}
.chip .k{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--muted);min-height:36px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn svg{width:19px;height:19px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on{color:var(--mark);border-color:color-mix(in srgb, var(--mark) 60%, var(--line))}
.btn.on svg{fill:currentColor}
.muted{color:var(--muted)}

/* ---------- home ---------- */
.hero{padding:22px 0 6px}
.hero .skt{font-size:clamp(30px,6vw,44px);line-height:1.25;color:var(--accent);margin:0}
.hero h1{font-family:var(--f-read);font-weight:600;font-size:clamp(26px,4.4vw,36px);margin:2px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.hero p.lede{font-family:var(--f-read);color:var(--muted);margin:0;max-width:56ch;font-size:calc(16.5px * var(--scale));line-height:1.6}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:20px}
@media (min-width:640px){ .cards.two{grid-template-columns:repeat(2,minmax(0,1fr))} }
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
a.card:hover{border-color:var(--muted)}
.card .eyebrow{margin-bottom:6px}
.card .ref{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.card .sa{font-family:var(--f-skt);font-size:calc(18px * var(--scale));line-height:1.65;margin:8px 0 6px}
.card .tx{font-family:var(--f-read);font-size:calc(15.5px * var(--scale));line-height:1.6;margin:0}
:root[lang=hi] .card .tx{font-family:var(--f-hi);line-height:1.8}
.chgrid{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr));gap:10px}
.chcard{position:relative;display:flex;flex-direction:column;gap:2px;height:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px;overflow:hidden}
.chcard:hover{border-color:var(--muted)}
.chcard .num{position:absolute;right:12px;top:2px;font-family:var(--f-skt);font-size:46px;line-height:1.2;color:var(--sunk);pointer-events:none}
.chcard .lab{font-size:12.5px;color:var(--muted);font-weight:600;position:relative}
.chcard .nm{font-family:var(--f-read);font-weight:600;font-size:16.5px;line-height:1.3;position:relative;text-wrap:balance}
:root[lang=hi] .chcard .nm{font-family:var(--f-hi);font-weight:400;font-size:17.5px}
.chcard .sk{font-family:var(--f-skt);color:var(--muted);font-size:14.5px;position:relative}
.chcard .foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{flex:1;height:4px;border-radius:4px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* ---------- chapter ---------- */
.chhead{position:relative;padding:16px 0 4px}
.chhead .bignum{font-family:var(--f-skt);font-size:64px;line-height:1;color:var(--accent);opacity:.9;margin:0 0 4px}
.chhead h1{font-family:var(--f-read);font-weight:600;font-size:clamp(26px,4.4vw,34px);line-height:1.2;margin:4px 0 2px;text-wrap:balance}
:root[lang=hi] .chhead h1{font-family:var(--f-hi);font-weight:400}
.chhead .sk{font-family:var(--f-skt);font-size:19px;color:var(--muted);margin:0}
.chhead .desc{font-family:var(--f-read);font-size:calc(16px * var(--scale));line-height:1.65;margin:14px 0 0;max-width:62ch}
:root[lang=hi] .chhead .desc{font-family:var(--f-hi);line-height:1.85}
.spkbar{display:flex;height:8px;border-radius:6px;overflow:hidden;margin:16px 0 8px;background:var(--sunk)}
.spkbar i{display:block;height:100%}
.spkleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.spkleg span{display:inline-flex;align-items:center;gap:6px}
.vlist{list-style:none;margin:8px 0 0;padding:0}
.vrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 12px;padding:14px 4px;border-top:1px solid var(--line);border-radius:8px}
.vrow:hover{background:color-mix(in srgb, var(--sunk) 60%, transparent)}
.vrow .rf{font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent);display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:15px}
.vrow .rf .marks{display:flex;gap:5px;align-items:center}
.vrow .rf .seen{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.45}
.vrow .rf svg{width:13px;height:13px;fill:var(--mark);color:var(--mark)}
.vrow .sa{font-family:var(--f-skt);font-size:calc(16.5px * var(--scale));line-height:1.6;margin:0 0 4px;color:var(--ink)}
.vrow .tx{font-family:var(--f-read);font-size:calc(15.5px * var(--scale));line-height:1.6;margin:0}
:root[lang=hi] .vrow .tx{font-family:var(--f-hi);line-height:1.8}
.vrow .who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:2px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.pager .btn{max-width:100%}
.pager .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- verse ---------- */
.verse{padding:12px 0 0;touch-action:pan-y}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.vtop a{color:var(--accent);font-weight:500}
.vref{font-family:var(--f-read);font-weight:600;font-size:clamp(30px,6vw,40px);margin:14px 0 0;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.speaker{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-size:15px;color:var(--muted)}
.speaker .uvaca{font-family:var(--f-skt);font-size:16px}
.vsa{font-family:var(--f-skt);font-size:calc(23px * var(--scale));line-height:1.75;margin:22px 0 0;color:var(--ink)}
.vsa .ln{display:block}
.viast{font-family:var(--f-read);font-style:italic;font-size:calc(16px * var(--scale));line-height:1.7;color:var(--muted);margin:14px 0 0}
.viast .ln{display:block}
.vtr{font-family:var(--f-read);font-size:calc(19px * var(--scale));line-height:1.65;margin:24px 0 0;padding-left:16px;border-left:3px solid var(--accent);max-width:62ch}
.vtr.hi{font-family:var(--f-hi);line-height:1.85}
.vtr2{font-family:var(--f-read);font-size:calc(16px * var(--scale));line-height:1.65;margin:14px 0 0;padding-left:19px;color:var(--muted);max-width:62ch}
.vtr2.hi{font-family:var(--f-hi);line-height:1.85}
.vtr2 b{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.06em;margin-right:6px}
.vactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.vtags{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.vtags .grp p{margin:0 0 8px}
.vnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:30px}
.vnav a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}
.vnav a:hover{border-color:var(--muted)}
.vnav a.nx{text-align:right;align-items:flex-end}
.vnav small{color:var(--muted);font-size:13px}
.vnav b{font-variant-numeric:tabular-nums;color:var(--accent)}
.vnav .t{font-family:var(--f-read);font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.swipehint{display:block;text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px}
@media (min-width:700px){ .swipehint{display:none} }

/* ---------- topic ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
:root[lang=hi] .pill{letter-spacing:0;text-transform:none;font-size:13.5px}
.thead{padding:16px 0 4px}
.thead h1{font-family:var(--f-read);font-weight:600;font-size:clamp(28px,5vw,38px);line-height:1.15;margin:8px 0 2px}
:root[lang=hi] .thead h1{font-family:var(--f-hi);font-weight:400}
.thead .sk{font-family:var(--f-skt);font-size:20px;color:var(--muted);margin:0}
.thead .meta{color:var(--muted);margin:4px 0 0}
.thead .desc{font-family:var(--f-read);font-size:calc(16.5px * var(--scale));line-height:1.65;margin:14px 0 0;max-width:62ch}
:root[lang=hi] .thead .desc{font-family:var(--f-hi);line-height:1.85}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin:18px 0 4px}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-read);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px;margin:18px 0 6px}
.strip button{aspect-ratio:1/1.6;max-width:100%;border:0;border-radius:4px;cursor:pointer;padding:0;position:relative;background:var(--sunk)}
.strip button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:1px}

.irow .mt{grid-column:2;font-size:13.5px;color:var(--muted);line-height:1.35}
.irow .ct{grid-row:1 / span 2;grid-column:3;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;text-align:right}
.irow .ct b{display:block;color:var(--ink);font-size:16px}
.sbox{position:relative;margin:12px 0 0}
.sbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.sbox input{width:100%;font:inherit;font-size:17px;min-height:52px;padding:10px 14px 10px 44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sbox input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.empty{padding:28px 4px;color:var(--muted);font-family:var(--f-read);line-height:1.6}
mark{background:color-mix(in srgb, var(--mark) 30%, transparent);color:inherit;border-radius:3px;padding:0 1px}
.more{margin:14px 0 0}

/* ---------- context column ---------- */
.ctx h3{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:24px 0 8px}
:root[lang=hi] .ctx h3{letter-spacing:0;text-transform:none;font-size:14.5px}
.ctx .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.crow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .dot{align-self:center}
.crow .nm{font-weight:600;font-size:15px;line-height:1.3}
.crow .mt{grid-column:2 / span 2;font-size:13px;color:var(--muted);line-height:1.4}
.crow .ct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.crow:hover .nm{color:var(--accent)}
.about{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0}

/* ---------- explore ---------- */
.explore{position:relative;height:calc(100dvh - 61px - var(--tab-h) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));min-height:360px;

.explore canvas{display:block;width:100%;height:100%;cursor:grab}

.zbtns{position:absolute;right:max(12px, env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}

.zbtns svg{width:20px;height:20px}
.ghint{position:absolute;left:max(12px, env(safe-area-inset-left,0px));top:12px;right:72px;font-size:13px;color:var(--muted);pointer-events:none}

.gpanel{position:absolute;left:max(10px, env(safe-area-inset-left,0px));right:max(10px, env(safe-area-inset-right,0px));bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 8px 28px rgb(0 0 0 / .18)}
.gpanel .nm{font-family:var(--f-read);font-weight:600;font-size:19px;margin:4px 0 0}
.gpanel .mt{color:var(--muted);font-size:14px;margin:2px 0 0}
.gpanel .ds{font-family:var(--f-read);font-size:14.5px;line-height:1.55;margin:8px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
:root[lang=hi] .gpanel .ds{font-family:var(--f-hi)}
.gpanel .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.gpanel .x{position:absolute;right:6px;top:6px}
@media (min-width:900px){ .gpanel{left:auto;right:76px;top:12px;bottom:auto;width:340px} }

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgb(10 14 20 / .42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86dvh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px max(18px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px));box-shadow:0 -8px 30px rgb(0 0 0 / .2)}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-family:var(--f-read);font-weight:600;font-size:21px;margin:4px 0 2px}
.sheet .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}

.sheet .lbl{font-weight:500}
@media (min-width:700px){ .scrim{align-items:center} .sheet{border-radius:20px} }
.switch{position:relative;width:52px;height:32px;border-radius:999px;border:0;background:var(--line);cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .18s}
.switch[aria-checked=true]{background:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500}
@media (min-width:700px){ .toast{bottom:24px} }
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
.proto{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}

@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} ::view-transition-group(*){animation:none!important} }
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}

  V.forEach((v,i) => {
    v.i = i; v.id = `v${v.c}-${v.v}`; v.ref = `${v.c}.${v.v}`; VB.set(v.ref, v);
    const set = new Set([voice(v), ...(v.vo ? [v.sp] : []), ...v.p, ...v.k].filter(id => HB.has(id)));
    v.tags = [...set];
    HB.get("ch"+v.c).vs.push(v);
    v.tags.forEach(id => { const h = HB.get(id); h.vs.push(v); h.chc[v.c]++; if(id===voice(v)) h.speak.push(v); });
    v.tags.forEach(a => v.tags.forEach(b => { if(a!==b){ const m = HB.get(a).co; m.set(b,(m.get(b)||0)+1); } }));
    // searchable text
    v.s_en = (v.en||"").toLowerCase(); v.s_tr = norm(v.tr||""); v.s_dev = (v.sa||"") + " " + (v.hi||"");
  });
  H.forEach(h => { h.s = norm([h.label,h.meta,h.hl].join(" ")) + " " + (h.skt||"") + " " + (h.hl||""); });
}
// transliteration-tolerant matching: kṛṣṇa, krishna and krsna all meet at "krsna"
function norm(s){
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
    .replace(/sh/g,"s").replace(/ri/g,"r").replace(/aa/g,"a").replace(/ee/g,"i").replace(/oo/g,"u").replace(/w/g,"v").replace(/[^a-z0-9ऀ-ॿ ]/g," ");
}
function saLines(v){
  const lines = v.sa.split("\n").map(s=>s.trim()).filter(Boolean);
  let uvaca = "";
  if(lines.length > 1 && /उवाच/.test(lines[0])){ uvaca = lines.shift().replace(/[|।]/g,"").trim(); }
  const body = lines.map(l => l.replace(/\s*\|\|\s*([०-९]+)-([०-९]+)\s*\|\|/, "\u00a0॥\u00a0$1.$2\u00a0॥").replace(/\|\|/g,"॥").replace(/\|/g,"।"));
  return {uvaca, body};
}
function trLines(v){
  const lines = v.tr.split("\n").map(s=>s.trim()).filter(Boolean);
  if(lines.length > 1 && /uvāca/.test(lines[0])) lines.shift();
  return lines.map(l => l.replace(/\|\|\s*\d+-\d+\s*\|\|/, "॥").replace(/\|\|/g,"॥").replace(/\|/g,"।"));
}

// ===================== shell =====================
const NAV = [["home","read",IC.read],["explore","explore",IC.explore],["index","index",IC.index],["search","search",IC.search],["saved","saved",IC.saved]];
function section(route){ return route.name==="explore" ? "explore" : route.name==="index" || route.name==="topic" ? "index" : route.name==="search" ? "search" : route.name==="saved" ? "saved" : "home"; }
function drawShell(route){
  const sec = section(route);
  document.getElementById("rail").innerHTML = `<div class="brand" aria-hidden="true">ॐ</div>` +
    NAV.map(([t,k,ic]) => `<a href="#${t}" ${sec===t?'aria-current="page"':""}><span class="ico">${ic}</span>${esc(k==="index"?u().indexShort:u()[k])}</a>`).join("") +
    `<div class="spacer"></div><button type="button" id="railset"><span class="ico">${IC.set}</span>${esc(u().settings)}</button>`;
  document.getElementById("tabs").innerHTML = NAV.map(([t,k,ic]) =>
    `<a href="#${t}" ${sec===t?'aria-current="page"':""}><span class="ico">${ic}</span>${esc(k==="index"?u().indexShort:u()[k])}</a>`).join("");
  const curCh = route.name==="chapter" ? route.c : route.name==="verse" ? route.v.c : 0;
  document.getElementById("side").innerHTML = `<h2>${esc(u().chapters)}</h2><ol>` + CH.map(c => {
    const read = c.vs.filter(v=>readSet.has(v.ref)).length;
    return `<li><a href="#c${c.num}" ${curCh===c.num?'aria-current="true"':""}><span class="n">${dev(c.num)}</span><span>${esc(name(c))}</span><span class="c">${read?`${read}/`:""}${c.vs.length}</span></a></li>`;
  }).join("") + `</ol>`;
  document.getElementById("railset").onclick = openSettings;
  const back = document.getElementById("back");
  back.hidden = route.name==="home" || route.name==="explore" || route.name==="index" || route.name==="search" || route.name==="saved";
  back.innerHTML = IC.back; back.setAttribute("aria-label", u().back);
  // forward goes to the next page in reading order: next verse, or a chapter's first verse
  const fwd = document.getElementById("fwd");
  const nxt = route.name==="verse" ? V[route.v.i+1] : route.name==="chapter" ? CH[route.c-1].vs[0] : null;
  fwd.hidden = !nxt; fwd.innerHTML = IC.fwd;
  if(nxt){ fwd.href = "#"+nxt.id; fwd.setAttribute("aria-label", `${u().next}: ${nxt.ref}`); fwd.title = `${u().next}: ${nxt.ref}`; }
  document.getElementById("setbtn").innerHTML = IC.set;
  document.getElementById("langbtn").textContent = isHi() ? "EN" : "हि";
  document.getElementById("langbtn").setAttribute("aria-label", isHi() ? "Switch to English" : "हिन्दी में देखें");
}
document.getElementById("back").onclick = () => { if(history.length > 1) history.back(); else go("home"); };
document.getElementById("langbtn").onclick = () => setLang(isHi() ? "en" : "hi");
document.getElementById("setbtn").onclick = openSettings;
window.addEventListener("scroll", () => document.getElementById("top").classList.toggle("scrolled", window.scrollY > 4), {passive:true});

function setLang(l){ lang = l; store.set("lang", l); document.documentElement.lang = l; render(true); }
function applyPrefs(boot){
  document.documentElement.style.setProperty("--scale", prefs.size);
  if(prefs.theme==="system"){ if(!boot) document.documentElement.removeAttribute("data-theme"); }
  else document.documentElement.setAttribute("data-theme", prefs.theme);
  store.set("prefs", prefs);
}

// ===================== router =====================
function parse(h){
  h = (h||"").replace(/^#/,"") || "home";
  let m;
  if((m = /^c(\d{1,2})$/.exec(h)) && +m[1]>=1 && +m[1]<=18) return {name:"chapter", c:+m[1]};
  if((m = /^v(\d{1,2})-(\d{1,2})$/.exec(h)) && VB.has(`${m[1]}.${m[2]}`)) return {name:"verse", v:VB.get(`${m[1]}.${m[2]}`)};
  if((m = /^t-([a-z0-9]+)$/.exec(h)) && HB.has(m[1])) return {name:"topic", h:HB.get(m[1])};
  if(["explore","index","search","saved"].includes(h)) return {name:h};
  return {name:"home"};
}
let current = null;
function go(t){ if(location.hash.slice(1)===t) render(); else location.hash = t; }
window.addEventListener("hashchange", () => render());
function render(keepScroll){
  if(!V.length) return;
  const route = parse(location.hash);
  const key = location.hash || "#home";
  const same = current && current.key===key;
  const run = () => {
    current = route; route.key = key; drawShell(route);
    const view = document.getElementById("view");
    const ttl = document.getElementById("ttl");
    stopGraph();
    if(route.name==="home"){ ttl.textContent = u().app; view.innerHTML = page(homeView(), homeCtx()); }
    else if(route.name==="chapter"){ const c = CH[route.c-1]; ttl.textContent = `${u().chapter} ${c.num} · ${name(c)}`; view.innerHTML = page(chapterView(c), chapterCtx(c)); }
    else if(route.name==="verse"){ const v = route.v; ttl.textContent = `${u().verse} ${v.ref}`; view.innerHTML = page(verseView(v), verseCtx(v)); markRead(v); wireVerse(v); }
    else if(route.name==="topic"){ const h = route.h; if(lastTopic !== h.id){ tFilter = {mode:"all", ch:0}; lastTopic = h.id; } ttl.textContent = name(h); view.innerHTML = page(topicView(h), topicCtx(h)); wireTopic(h); }
    else if(route.name==="index"){ ttl.textContent = u().index; view.innerHTML = page(indexView(), aboutCtx()); wireIndex(); }
    else if(route.name==="search"){ ttl.textContent = u().search; view.innerHTML = page(searchView(), aboutCtx()); wireSearch(); }
    else if(route.name==="saved"){ ttl.textContent = u().saved; view.innerHTML = page(savedView(), aboutCtx()); }
    else if(route.name==="explore"){ ttl.textContent = u().explore; view.innerHTML = exploreView(); startGraph(); }
    wireCommon();
    if(!(keepScroll || same)) window.scrollTo(0,0);
  };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(document.startViewTransition && !reduce && !same && current) document.startViewTransition(run); else run();
}
const page = (main, ctx) => `<div class="page"><div class="content">${main}</div><aside class="ctx">${ctx}</aside></div>`;

// ===================== components =====================
function verseRow(v, opts={}){
  const s = saLines(v);
  const q = opts.q;
  const txt = q ? hl(tr(v), q) : esc(tr(v));
  const sp = HB.get(voice(v));
  return `<li><a class="vrow" href="#${v.id}">
    <span class="rf">${v.ref}<span class="marks">${readSet.has(v.ref)?'<i class="seen" title="read"></i>':""}${savedSet.has(v.ref)?IC.star:""}</span></span>
    <span>${opts.who ? `<span class="who"><i class="dot d-${voice(v)}"></i>${esc(name(sp))}</span>` : ""}
      ${prefs.sa ? `<p class="sa">${esc(s.body[0])}${s.body.length>1?"…":""}</p>` : ""}
      <p class="tx" lang="${lang}">${txt}</p></span></a></li>`;
}
function hl(text, q){
  const t = esc(text); if(!q || q.length < 2) return t;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return t;
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}
function topicRows(list, countFn){
  return `<div class="box">` + list.map(h => `<a class="crow" href="#t-${h.id}"><i class="dot d-${h.type}"></i><span class="nm">${esc(name(h))}</span><span class="ct">${countFn(h)}</span><span class="mt">${esc(metaOf(h))}</span></a>`).join("") + `</div>`;
}
function aboutCtx(){
  return `<h3>${esc(u().about)}</h3><p class="about">${esc(u().aboutT)}</p><p class="about" style="margin-top:10px"><span class="proto">${esc(u().proto)}</span></p>`;
}
const listMore = (id, rows, n) => rows.length > n ? `<button class="btn more" data-more="${id}">${esc(u().showMore(rows.length - n))}</button>` : "";

// ===================== home =====================
function votd(){
  const d = new Date(); const day = Math.floor((d - new Date(d.getFullYear(),0,0)) / 864e5);
  return VB.get(VOTD[day % VOTD.length]) || V[0];
}

    : `<a class="card" href="#v1-1"><p class="eyebrow">${esc(u().start)}</p><span class="ref">1.1</span> <span class="muted">· ${esc(name(CH[0]))}</span><p class="tx" style="margin-top:8px">${esc(u().startT)}</p></a>`;
  return `<section class="hero"><p class="skt">श्रीमद्भगवद्गीता</p><h1>${isHi() ? "भगवद्गीता" : "The Bhagavad Gita"}</h1><p class="lede">${esc(u().lede)}</p></section>

  <h2 class="sec">${esc(u().chapters)}</h2>
  <ol class="chgrid">${CH.map(c => {
    const r = c.vs.filter(v=>readSet.has(v.ref)).length;
    return `<li><a class="chcard" href="#c${c.num}"><span class="num" aria-hidden="true">${dev(c.num)}</span>
      <span class="lab">${esc(u().chapter)} ${c.num}</span><span class="nm">${esc(name(c))}</span><span class="sk">${esc(c.skt)}</span>
      <span class="foot"><span class="prog"><i style="width:${(r/c.vs.length*100).toFixed(1)}%"></i></span>${r ? esc(u().readOf(r,c.vs.length)) : `${c.vs.length} ${esc(u().verses)}`}</span></a></li>`;
  }).join("")}</ol>`;
}
function homeCtx(){
  const people = H.filter(h=>h.type==="person").sort((a,b)=>b.vs.length-a.vs.length).slice(0,6);
  const ideas = H.filter(h=>h.type==="concept").sort((a,b)=>b.vs.length-a.vs.length).slice(0,6);
  return `<h3>${esc(u().people)}</h3>${topicRows(people, h=>h.vs.length)}<h3>${esc(u().ideas)}</h3>${topicRows(ideas, h=>h.vs.length)}${aboutCtx()}`;
}

// ===================== chapter =====================
function speakerMix(list){
  const m = new Map(); list.forEach(v => m.set(voice(v), (m.get(voice(v))||0)+1));
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
function chapterView(c){
  const mix = speakerMix(c.vs), n = c.vs.length;
  const prev = c.num > 1 ? CH[c.num-2] : null, next = c.num < 18 ? CH[c.num] : null;
  return `<header class="chhead"><p class="bignum skt" aria-hidden="true">${dev(c.num)}</p>
    <p class="eyebrow">${esc(u().chapter)} ${c.num} · ${n} ${esc(u().verses)}</p>
    <h1>${esc(name(c))}</h1><p class="sk">${esc(c.skt)}</p><p class="desc" lang="${lang}">${esc(descOf(c))}</p>
    <div class="spkbar" aria-hidden="true">${mix.map(([id,k]) => `<i class="d-${id}" style="width:${(k/n*100).toFixed(2)}%"></i>`).join("")}</div>
    <div class="spkleg">${mix.map(([id,k]) => `<span><i class="dot d-${id}"></i>${esc(name(HB.get(id)))} ${k}</span>`).join("")}</div></header>
  <ol class="vlist" id="vl">${c.vs.map(v => verseRow(v,{who:mix.length>1})).join("")}</ol>
  <nav class="pager">${prev ? `<a class="btn" href="#c${prev.num}">${IC.back}<span>${prev.num}. ${esc(name(prev))}</span></a>` : "<span></span>"}
    ${next ? `<a class="btn" href="#c${next.num}"><span>${next.num}. ${esc(name(next))}</span><span style="transform:rotate(180deg);display:inline-flex">${IC.back}</span></a>` : ""}</nav>`;
}
function topIn(list, types, n){
  const m = new Map(); list.forEach(v => v.tags.forEach(id => { const h = HB.get(id); if(types.includes(h.type)) m.set(id,(m.get(id)||0)+1); }));
  return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n).map(([id,k]) => ({h:HB.get(id), k}));
}
function chapterCtx(c){
  const ppl = topIn(c.vs, ["person"], 7), ide = topIn(c.vs, ["concept","guna","path"], 8);
  const row = ({h,k}) => `<a class="crow" href="#t-${h.id}"><i class="dot d-${h.type}"></i><span class="nm">${esc(name(h))}</span><span class="ct">${k}</span><span class="mt">${esc(metaOf(h))}</span></a>`;
  return (ppl.length ? `<h3>${esc(u().peopleHere)}</h3><div class="box">${ppl.map(row).join("")}</div>` : "") +
         (ide.length ? `<h3>${esc(u().ideasHere)}</h3><div class="box">${ide.map(row).join("")}</div>` : "");
}

// ===================== verse =====================

  return `<article class="verse" id="verse">

    <h2 class="vref">${v.ref}</h2>

    ${prefs.sa ? `<p class="vsa" lang="sa">${s.body.map(l=>`<span class="ln">${esc(l)}</span>`).join("")}</p>` : ""}
    ${prefs.iast ? `<p class="viast" lang="sa-Latn">${trLines(v).map(l=>`<span class="ln">${esc(l)}</span>`).join("")}</p>` : ""}

    ${prefs.other ? `<p class="vtr2 ${isHi()?"":"hi"}" lang="${isHi()?"en":"hi"}"><b>${isHi()?"EN":"हिन्दी"}</b>${esc(tr2(v))}</p>` : ""}
    <div class="vactions">

function verseCtx(v){
  const tags = v.tags.map(id=>HB.get(id));
  const c = CH[v.c-1];
  return `<h3>${esc(u().inVerse)}</h3>` + topicRows(tags, h=>h.vs.length) +
    `<h3>${esc(u().chapter)} ${c.num}</h3><a class="card" href="#c${c.num}"><span class="ref">${esc(name(c))}</span><p class="tx" lang="${lang}" style="margin-top:6px;font-size:14.5px">${esc(descOf(c))}</p></a>`;
}
function markRead(v){
  readSet.add(v.ref); store.set("read",[...readSet]);
  recent = [v.ref, ...recent.filter(r=>r!==v.ref)].slice(0,30); store.set("recent",recent);
}
function wireVerse(v){
  const sb = document.getElementById("savebtn");
  sb.onclick = () => {
    if(savedSet.has(v.ref)) savedSet.delete(v.ref); else savedSet.add(v.ref);
    store.set("saved",[...savedSet]);
    const on = savedSet.has(v.ref);
    sb.classList.toggle("on", on); sb.setAttribute("aria-pressed", on); sb.querySelector("span").textContent = on ? u().savedL : u().save;
    toast(on ? u().savedL : u().save);
  };
  document.getElementById("copybtn").onclick = () => {
    const text = `${saLines(v).body.join("\n")}\n\n${tr(v)}\n\nBhagavad Gita ${v.ref}`;
    try{ navigator.clipboard.writeText(text).then(()=>toast(u().copied), ()=>toast(u().copyFail)); }catch(e){ toast(u().copyFail); }
  };
  // swipe between verses on touch screens
  const el = document.getElementById("verse"); let sx=0, sy=0, st=0;
  el.addEventListener("touchstart", e => { const t = e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); }, {passive:true});
  el.addEventListener("touchend", e => {
    const t = e.changedTouches[0], dx = t.clientX-sx, dy = t.clientY-sy;
    if(Date.now()-st < 600 && Math.abs(dx) > 70 && Math.abs(dy) < 50){ const w = V[v.i + (dx<0?1:-1)]; if(w) go(w.id); }
  }, {passive:true});
}

// ===================== topic =====================
let tFilter = {mode:"all", ch:0};
function topicView(h){
  const isP = h.type==="person";

    `<button data-ch="${i+1}" aria-pressed="${tFilter.ch===i+1}" title="${u().chapter} ${i+1}: ${k}" style="background:${k ? `color-mix(in srgb, var(--t-${h.type==="chapter"?"concept":h.type}) ${Math.round(18 + 82*k/max)}%, var(--sunk))` : "var(--sunk)"}"><span>${i+1}</span></button>`).join("")}</div>
  <div class="tools">${isP && h.speak.length && h.speak.length < h.vs.length ? `<div class="seg" role="group">

      <button data-mode="speaks" aria-pressed="${tFilter.mode==="speaks"}">${esc(u().speaks)}</button>
      <button data-mode="appears" aria-pressed="${tFilter.mode==="appears"}">${esc(u().appears)}</button></div>` : "<span></span>"}

function topicList(h){

function stopGraph(){ if(graph){ graph.destroy(); graph = null; } }

const RC = 360, R0 = RC + 46, COLS = 8, ROWH = 13, SPAN = 2*Math.PI/18*0.8;

  const hubs = H.filter(h => h.type!=="chapter" && h.type!=="section" && h.vs.length);
  hubs.forEach(h => {
    // start each hub near the chapter it appears in most
    let best = 1; for(let i=1;i<=18;i++) if(h.chc[i] > h.chc[best]) best = i;
    const a = angOf(best) + (Math.random()-.5)*.3, rr = RC*(0.35 + Math.random()*0.4);
    nodes.push({h, kind:"hub", x:rr*Math.cos(a), y:rr*Math.sin(a), r: Math.max(4.5, Math.min(16, 3 + Math.sqrt(h.vs.length)*1.05))});

    .force("charge", d3.forceManyBody().strength(-45))

  links.forEach(l => { nb.get(nodes[l.source.index ?? l.source].h.id).add(nodes[l.target.index ?? l.target].h.id); nb.get(nodes[l.target.index ?? l.target].h.id).add(nodes[l.source.index ?? l.source].h.id); });

}

  ro.observe(wrap);
  const mq = matchMedia("(prefers-color-scheme: dark)"); const onMq = () => recolor(); mq.addEventListener("change", onMq);
  const mo = new MutationObserver(recolor); mo.observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
  if(document.fonts) document.fonts.ready.then(draw);
  size(); recolor(); sv.call(zoom.transform, fitT());
  return { recolor, destroy(){ ro.disconnect(); mq.removeEventListener("change", onMq); mo.disconnect(); } };
}

// ===================== boot =====================
document.documentElement.lang = lang;
applyPrefs(true);
Promise.all([fetch("verses.json").then(r=>{ if(!r.ok) throw 0; return r.json(); }), fetch("hubs.json").then(r=>{ if(!r.ok) throw 0; return r.json(); })])
  .then(([verses, hubs]) => { prepare(verses, hubs); render(); })
  .catch(() => { document.getElementById("view").innerHTML = `<p class="loading">The verses did not load. Reload the page to try again.</p>`; });
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
