/* Site shell: the one navigation every page shares (home, the map, the documents and all three readers).

.gnav{display:none}

.gnav .gsp{flex:1}
.gnav svg{display:none}

.gtabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
